# The gate AGENTS.md names — tsc --noEmit, then the smoke test — run mechanically
# on every push and pull request, on both platforms the plugin is exercised on:
# Linux, where CI usually runs, and Windows, where it is developed and where the
# installer's junction handling is a real code path rather than a stand-in.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The smoke test imports the TypeScript sources directly and needs the
          # type stripping Node enables by default from 22.18; the local
          # toolchain measures at 22.23.2, and CI tracks that major line.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke
